# Basic-Lite TRACE — Configuración Canónica de Ruff
target-version = "py310"
line-length = 120

[lint]
select = [
    "E4", "E7", "E9", "F",  # Errores sintácticos y de import/variables
    "I",                    # Orden de importación isort
    "UP",                   # Modernización de sintaxis Python 3.10+
]
ignore = [
    "E402",  # module-import-not-at-top (requerido para scripts de test/eval con sys.path.insert)
]
