[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-lite-trace"
version = "1.4.0"
description = "Basic-Lite TRACE — W1.58A8 selective-residency ternary neural architecture and C inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Miguel Angel Aranguren Ramirez (Miguel19x)", email = "miguelaranguren19x@outlook.com" },
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]
lm = [
    "datasets>=2.14.0",
]

[tool.setuptools.packages.find]
include = ["trace*"]
