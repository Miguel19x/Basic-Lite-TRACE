name: Basic-Lite TRACE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y gcc libomp-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build C Engine and Kernel
        run: make all

      - name: Run Active Test Suites
        run: |
          PYTHONPATH=. python tests/test_smoke.py
          PYTHONPATH=. python tests/test_avx2_kernel.py
          PYTHONPATH=. python tests/test_paged_bitcos.py
          PYTHONPATH=. python tests/test_context_manager.py
          PYTHONPATH=. python tests/test_e0_hygiene.py
          PYTHONPATH=. python tests/test_architecture_integrity.py
          if [ -f checkpoints/trace_s456_fase1_paged_bitcos.bin ]; then
            PYTHONPATH=. python tests/test_trace_infer.py
            PYTHONPATH=. python tests/test_parity_and_falsification.py
            PYTHONPATH=. python tests/test_benchmark_fase2.py
          fi
